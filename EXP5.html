<!DOCTYPE html>
<html>
    <head>
        <title>HOTEL ROOM BOOKING</title>
    </head>
    <body>
        <h1 align="center">HOTEL ROOM BOOKING</h1>
        <br>
        <center>
        <label for="name">Full Name:</label>
        <input type="text" placeholder="name" >
        <br>
        <label for="email">Email:</label>
        <input type="email" placeholder="email">
        <br>
        <br>
        <label for="phone" value="phone">Phone:</label>
        <input type="tel" placeholder="phone">
        <br>
        <br>
        <label for="checkin" value="chekin">Check-in Date:</label>
        <input type="date" value="date">
        <br>
        <br>
        <label for="checkout" value="checkout">Check-out Date:</label>
        <input type="date" value="Checkout">
        <br>
        <br>
        <label for="room" value="room">Room:</label>
        <select name="Room">
            <option value="singleroom">Single Romm</option>
            <option value="doubleroom">Double Romm</option>
            <option value="deleuxeroom">Deleuxe Romm</option>
            <option value="slitroom">Slit Romm</option>
        </select>
        <br>
        <br>
        <label for="requests" value="specialrequests">Requests</label>
        <textarea type="text" value="requests" rows="5" col="40" placeholder="Special Requests"></textarea>
        <br>
        <br>
        <button type="submit">Book Now</button>
        <br>
        <br>
        <button type="submit">Reset Form</button>
        </center>
        
    </body>
</html>
